[build-system]
requires = ["setuptools"]

[project]
name = "TODO"
version = "0.0.1"
requires-python = ">=3.10"
description = "TODO"
readme = "README.md"
dependencies = [
"pandas~=2.3.1",
"pyarrow~=23.0.0",
"scipy~=1.17.1",
"jinja2~=3.1.6",
"seaborn~=0.13.2",
"statsmodels~=0.14.6",
]
# TODO: Include author information
authors = [ ]

[project.optional-dependencies]
dev = [
"mypy~=1.19.1"
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["*"]


[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true